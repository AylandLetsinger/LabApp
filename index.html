<!-- PURPOSE OF SCRIPT: 
 This is the main HTML file for the Lab App PWA. 
 It's purpose is to provide a framework for the PWA and to link all the other files together. -->

<!DOCTYPE html> <!-- specify this is an HTML5 document -->

<html lang="en"> <!-- specify the language of the document -->  

<head> <!-- HEAD SECTION - Users don't see this --> 
    
    <!-- 1. Essential Meta Tags -->
    <meta charset="UTF-8"> <!-- specify character encoding for proper display of special characters -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- makes PWA mobile-responsive -->
    <!-- 2. Page Title (shows in browser tab) --> 
    <title>THE LAB APP</title> <!-- specify the title of the PWA -->

    <!-- 3. Links to External CSS files --> <!-- preferred for styling -->
    <link rel="stylesheet" href="css/styles.css"> <!-- link to the CSS file -->
    
    <!-- 4. SEO Meta Tags --> <!-- Used by search engines to understand the content of the page -->
    <meta name="description" content="The Lab App is a PWA and research tool that allows you to perform calculations and manage your lab experiments."> <!-- specify the description of the PWA -->
    <meta name="author" content="created by Ayland Letsinger and Sarah Little-Letsinger"> <!-- specify the author of the PWA -->
    <meta name="keywords" content="lab, research, calculations, experiment, dilutions"> <!-- specify the keywords of the PWA -->

    <!-- 5. Favicon (tab icon)--> <!-- preferred for branding -->
    <link rel="icon" type="image/jpg" sizes="192x192" href="assets/icons/Icon192.jpg"> <!-- link to the favicon -->
    <link rel="icon" type="image/jpg" sizes="512x512" href="assets/icons/Icon512.jpg"> <!-- link to the favicon -->

    <!-- 6. Manifest file -->
    <link rel="manifest" href="manifest.json"> <!-- link to the manifest file -->

</head> <!-- end the head section -->

<body> <!-- BODY SECTION - Users see everything here -->

    <!-- 1. Header/Navigation -->
    <header>
        <h1>THE LAB APP</h1> <!-- specify the main heading of the page -->
        <nav> <!-- specify the navigation section of the page -->
            <ul>
                <li><a href="index.html" class="active">Home</a></li> <!-- link to the home page -->
                <li><a href="pages/about.html">About</a></li> <!-- link to the about page -->
                <li><a href="pages/dosage.html">Dosage</a></li> <!-- link to the dosage page -->
                <li><a href="pages/molarity.html">Molarity</a></li> <!-- link to the molarity page -->
                <li><a href="pages/dilutions.html">Dilutions</a></li> <!-- link to the dilutions page -->
                <li><a href="pages/antibodies.html">Antibodies</a></li> <!-- link to the antibodies page -->
            </ul>
        </nav> <!-- end the navigation section -->
    </header> <!-- end the header section -->

    <!-- 2. Main Content on Home Page -->
    <main>
        <h2>Welcome to The Lab App!</h2> <!-- specify the subheading of the page -->
        
    <!-- 3. Any JavaScript that can wait until the user has loaded the page -->
    <script src="js/app.js"></script> <!-- link to the JavaScript file -->

    <!-- 4. Footer -->
    <footer>
        <p>&copy; 2024 The Lab App</p> <!-- specify the copyright of the PWA -->
    </footer> <!-- end the footer section -->   

</body> <!-- end the body section -->

</html> <!-- end the HTML document -->
